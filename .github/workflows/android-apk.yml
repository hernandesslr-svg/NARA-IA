name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "index.html", "package.json", "package-lock.json", "vite.config.js", "capacitor.config.json", ".github/workflows/android-apk.yml", "scripts/**"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Download compact model into app assets
        run: |
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="onnx-community/SmolLM2-135M-Instruct",
              local_dir="public/models/onnx-community/SmolLM2-135M-Instruct",
              allow_patterns=[
                  "config.json", "generation_config.json", "tokenizer.json",
                  "tokenizer_config.json", "special_tokens_map.json",
                  "chat_template.jinja", "onnx/*", "*.json", "*.txt"
              ],
              ignore_patterns=["*.safetensors", "*.bin", "*.msgpack"]
          )
          PY
      - name: Build web app with bundled model
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nara-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
